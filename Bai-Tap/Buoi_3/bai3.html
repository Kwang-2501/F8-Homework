<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3 - Thẻ sản phẩm</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; }
    h1 { width: 100vw; height: 20vh; font-size: 2rem; }
    .card { width: 50%; max-width: 400px; padding: 1.5em; color: #1976d2; }
    h3 { font-size: 1.5rem; color: initial; }
    p { font-size: 1rem; }
    .price { font-size: 1.25rem; }
    .price span { font-size: 1.5em; font-weight: bold; }
    .card a { color: inherit; }
    ul { list-style: initial; }
  </style>
</head>
<body>
  <h1>Sản phẩm nổi bật</h1>
  <div class="card">
    <h3>Tai nghe Bluetooth</h3>
    <p>Âm thanh sống động, pin 20 giờ.</p>
    <p class="price">Giá: <span>590.000đ</span></p>
    <a href="#">Xem chi tiết</a>
  </div>
  <ul>
    <li>Bảo hành 12 tháng</li>
    <li>Miễn phí giao hàng</li>
  </ul>
</body>
</html>
